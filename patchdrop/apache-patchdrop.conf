# PatchDrop — Apache snippet for gg.trenas.fr (port 443 vhost).
# Isolé : ne touche NI à by_leve, NI à trocabane, NI aux autres ProxyPass.
# Demande un accès root/sudo pour activer. Sans sudo, envoie ce fichier à l'admin.
#
# 1) Copier le dossier patchdrop dans /home/leo/patchdrop
# 2) sudo cp apache-patchdrop.conf /etc/apache2/conf-available/patchdrop.conf
#    (ou coller le bloc <Location> dans le VirtualHost *:443 de gg.trenas.fr)
# 3) sudo a2enconf patchdrop && sudo systemctl reload apache2
# 4) systemctl --user enable --now patchdrop (service user fourni)

RedirectMatch ^/patchdrop$ /patchdrop/
ProxyPass        /patchdrop/ http://127.0.0.1:3250/
ProxyPassReverse /patchdrop/ http://127.0.0.1:3250/
